<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12"><link rel="manifest" href="manifest.json"><title>Stock Practice Trader</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:720px;margin:auto;padding:14px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 14px}.brand{font-weight:800;font-size:22px}.paper{font-size:11px;color:#8ee6a8;background:#102117;padding:7px 9px;border-radius:999px}
.card{background:#12151d;border:1px solid #242a36;border-radius:18px;padding:15px;margin-bottom:12px}.muted{color:#858d9e;font-size:13px}.big{font-size:31px;font-weight:850;margin:3px 0 2px}.green{color:#42d883}.red{color:#ff6675}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.stat{background:#0d1016;border-radius:13px;padding:11px}.stat b{display:block;margin-top:4px;font-size:17px}
.search{display:flex;gap:8px}.search input,.sheet input{min-width:0;flex:1;background:#0c0f15;color:#fff;border:1px solid #303747;border-radius:12px;padding:13px;font-size:16px}
button{min-height:44px;border:0;border-radius:12px;padding:11px 14px;font-weight:750;cursor:pointer}.light{background:#f4f6fa;color:#090b10}.buy{background:#173c29;color:#6df0a1}.sell{background:#472027;color:#ff98a1}.dark{background:#1a1f2a;color:#e9edf5}
.stockrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #252b36}.stockrow:last-child{border:0}.ticker{font-size:18px;font-weight:800}.right{text-align:right}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1}
.chartbox{margin-top:12px;background:#0b0e14;border-radius:15px;padding:8px}.charthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.charttabs{display:flex;gap:5px}.charttabs button{min-height:34px;padding:7px 9px;font-size:12px}.charttabs .active{background:#f4f6fa;color:#090b10}
svg{display:block;width:100%;height:250px}.line{fill:none;stroke:#e9edf5;stroke-width:2.5}.gridline{stroke:#242a35;stroke-width:1}.area{fill:#f4f6fa;opacity:.06}
.hold{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #252b36}.hold:last-child{border:0}.empty{text-align:center;color:#727a8b;padding:15px 0}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;padding:10px}.modal.open{display:flex}.sheet{width:min(620px,100%);background:#151923;border:1px solid #2c3340;border-radius:22px;padding:18px}.sheet h2{margin:0 0 5px}.sheet input{width:100%;margin:12px 0}.estimate{display:flex;justify-content:space-between;margin:8px 0 14px}.history{font-size:13px}.notice{font-size:12px;color:#777f90;margin-top:8px}
@media(max-width:420px){.big{font-size:27px}svg{height:220px}}
</style></head>
<body><div class="app">
<div class="top"><div class="brand">Stock Practice Trader</div><div class="paper">PAPER TRADING</div></div>

<div class="card">
<div class="muted">Portfolio value</div><div class="big" id="portfolio">$10,000.00</div><div id="pl" class="green">+$0.00 · 0.00%</div>
<div class="grid"><div class="stat"><span class="muted">Cash</span><b id="cash">$10,000.00</b></div><div class="stat"><span class="muted">Invested</span><b id="invested">$0.00</b></div></div>
</div>

<div class="card"><div class="search"><input id="search" placeholder="Search stock ticker"><button class="light" id="searchBtn">Search</button></div><div id="searchResult"></div></div>

<div class="card"><div class="muted">Watchlist</div><div id="watch"></div></div>
<div class="card"><div class="muted">Portfolio</div><div id="holdings"></div></div>
<div class="card"><div class="muted">Recent orders</div><div id="history"></div></div>
<div class="notice">Prices in this app are simulated for practice. No real money or brokerage account is connected.</div>
</div>

<div class="modal" id="modal"><div class="sheet">
<h2 id="modalTitle">Buy</h2><div class="muted" id="modalInfo"></div>
<input id="qty" type="number" min="1" step="1" placeholder="Shares">
<div class="estimate"><span class="muted">Estimated total</span><b id="estimate">$0.00</b></div>
<div class="actions"><button class="dark" id="cancel">Cancel</button><button id="confirm" class="buy">Confirm</button></div>
</div></div>

<script>
const defaults={
 AAPL:{name:"Apple",price:255},TSLA:{name:"Tesla",price:455},NVDA:{name:"NVIDIA",price:187},
 AMZN:{name:"Amazon",price:229},MSFT:{name:"Microsoft",price:517},GOOGL:{name:"Alphabet",price:245},
 META:{name:"Meta",price:735},NFLX:{name:"Netflix",price:1200}
};
let prices=JSON.parse(localStorage.getItem("spt-prices")||"null")||JSON.parse(JSON.stringify(defaults));
let state=JSON.parse(localStorage.getItem("spt-state")||"null")||{cash:10000,holdings:{},history:[],watch:["AAPL","TSLA","NVDA","AMZN","MSFT"]};
let selected=null,side=null,range="1D";

function q(t){if(!prices[t])prices[t]={name:t+" Corporation",price:100};return prices[t]}
function money(n){return "$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function save(){localStorage.setItem("spt-prices",JSON.stringify(prices));localStorage.setItem("spt-state",JSON.stringify(state))}
function points(t){
 const base=q(t).price, seed=t.split("").reduce((a,c)=>a+c.charCodeAt(0),0);
 let n=range==="1D"?48:range==="1W"?42:range==="1M"?30:24;
 let arr=[],v=base*(.94+(seed%9)/100);
 for(let i=0;i<n;i++){v*=1+((Math.sin(i*1.7+seed)*.003)+(Math.cos(i*.51+seed)*.002));arr.push(v)}
 let scale=base/arr[arr.length-1]; return arr.map(v=>v*scale);
}
function chart(t){
 const p=points(t), min=Math.min(...p),max=Math.max(...p),w=620,h=250,pad=12;
 const xy=p.map((v,i)=>{let x=pad+i*(w-2*pad)/(p.length-1),y=pad+(max-v)*(h-2*pad)/(max-min||1);return [x,y]});
 const line=xy.map(a=>a.join(",")).join(" L ");
 const area=line+" L "+(w-pad)+","+(h-pad)+" L "+pad+","+(h-pad)+" Z";
 let grids=[.2,.4,.6,.8].map(v=>`<line class="gridline" x1="${pad}" x2="${w-pad}" y1="${pad+v*(h-2*pad)}" y2="${pad+v*(h-2*pad)}"/>`).join("");
 return `<div class="chartbox"><div class="charthead"><div><b>${t}</b> <span class="muted">${q(t).name}</span></div><div class="charttabs">${["1D","1W","1M","1Y"].map(r=>`<button class="${range===r?"active":""}" data-range="${r}">${r}</button>`).join("")}</div></div><svg viewBox="0 0 ${w} ${h}" aria-label="${t} simulated price chart">${grids}<path class="area" d="M ${area}"/><path class="line" d="M ${line}"/></svg><div class="actions"><button class="buy" data-order="buy">Buy</button><button class="sell" data-order="sell">Sell</button></div></div>`
}
function renderSearch(t){
 const el=document.getElementById("searchResult"); if(!t){el.innerHTML="";return}
 const h=state.holdings[t]?.shares||0;el.innerHTML=`<div class="stockrow"><div><div class="ticker">${t}</div><div class="muted">${q(t).name}</div></div><div class="right"><b>${money(q(t).price)}</b><div class="green">Market price</div></div></div>${chart(t)}<div class="muted" style="margin-top:7px">Shares owned: ${h}</div>`;
 el.querySelectorAll("[data-range]").forEach(b=>b.onclick=()=>{range=b.dataset.range;renderSearch(t)});
 el.querySelectorAll("[data-order]").forEach(b=>b.onclick=()=>openOrder(b.dataset.order,t));
}
function render(){
 let invested=0;Object.entries(state.holdings).forEach(([t,h])=>invested+=h.shares*q(t).price);
 let total=state.cash+invested,pl=total-10000,pct=pl/100;
 portfolio.textContent=money(total);cash.textContent=money(state.cash);document.getElementById("invested").textContent=money(invested);
 document.getElementById("pl").textContent=(pl>=0?"+":"")+money(pl)+" · "+(pct>=0?"+":"")+pct.toFixed(2)+"%";
 document.getElementById("pl").className=pl>=0?"green":"red";
 document.getElementById("watch").innerHTML=state.watch.map(t=>`<div class="stockrow" data-t="${t}"><div><div class="ticker">${t}</div><div class="muted">${q(t).name}</div></div><div class="right"><b>${money(q(t).price)}</b><div class="muted">Tap for chart</div></div></div>`).join("");
 document.querySelectorAll("#watch [data-t]").forEach(x=>x.onclick=()=>{document.getElementById("search").value=x.dataset.t;renderSearch(x.dataset.t);window.scrollTo({top:0,behavior:"smooth"})});
 let hs=Object.entries(state.holdings).filter(([t,h])=>h.shares>0);
 document.getElementById("holdings").innerHTML=hs.length?hs.map(([t,h])=>{let v=h.shares*q(t).price,pl=(q(t).price-h.avg)*h.shares;return `<div class="hold"><div><b>${t}</b><div class="muted">${h.shares} shares · avg ${money(h.avg)}</div></div><div class="right"><b>${money(v)}</b><div class="${pl>=0?"green":"red"}">${pl>=0?"+":""}${money(pl)}</div></div></div>`}).join(""):'<div class="empty">No holdings yet.</div>';
 document.getElementById("history").innerHTML=state.history.length?state.history.slice().reverse().slice(0,12).map(o=>`<div class="hold history"><div><b class="${o.side==="BUY"?"green":"red"}">${o.side}</b> ${o.qty} ${o.ticker}<div class="muted">${o.time}</div></div><div class="right"><b>${money(o.total)}</b><div class="muted">@ ${money(o.price)}</div></div></div>`).join(""):'<div class="empty">No orders yet.</div>';
 let s=document.getElementById("search").value.trim().toUpperCase();if(s)renderSearch(s);
}
function openOrder(s,t){side=s;selected=t;modal.classList.add("open");modalTitle.textContent=(s==="buy"?"Buy ":"Sell ")+t;modalInfo.textContent=`${q(t).name} · ${money(q(t).price)} per share`;confirm.className=s==="buy"?"buy":"sell";qty.value="";estimate.textContent="$0.00"}
function close(){modal.classList.remove("open")}
function update(){let n=Math.floor(Number(qty.value)||0);estimate.textContent=money(n*q(selected).price)}
searchBtn.onclick=()=>{let t=search.value.trim().toUpperCase();if(t){q(t);renderSearch(t);save()}}
search.onkeydown=e=>{if(e.key==="Enter")searchBtn.click()}
qty.oninput=update;cancel.onclick=close;
confirm.onclick=()=>{let n=Math.floor(Number(qty.value));if(n<1)return alert("Enter at least 1 share.");let price=q(selected).price,total=price*n,h=state.holdings[selected]||{shares:0,avg:0};
 if(side==="buy"){if(total>state.cash)return alert("Not enough cash.");h.avg=(h.avg*h.shares+price*n)/(h.shares+n);h.shares+=n;state.cash-=total}else{if(n>h.shares)return alert("You don't own that many shares.");h.shares-=n;state.cash+=total}
 state.holdings[selected]=h;state.history.push({side:side.toUpperCase(),ticker:selected,qty:n,price,total,time:new Date().toLocaleString()});save();close();render()}
setInterval(()=>{Object.keys(prices).forEach(t=>prices[t].price*=1+(Math.random()-.5)*.006);save();render()},9000);
render();
</script></body></html>
